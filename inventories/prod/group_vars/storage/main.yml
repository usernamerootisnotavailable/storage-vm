---
postgresql_apps:
  - state: present
    name: app
    user: app
    password: "{{ secret_postgresql_app_password | mandatory }}"
    databases:
      - appdb
    # REQUIRED: replace with the Kubernetes egress CIDR that reaches storage01.
    cidrs:
      - 10.20.0.0/16
    extensions: []
    connection_limit: 100
    rotate_password: false

# Use a CA-issued certificate in production. The role validates that the
# provided files exist and that the key is owned by postgres:postgres.
postgresql_tls_mode: provided

postgresql_backup_enabled: true
# Tune shared_buffers, effective_cache_size, work_mem, and max_connections for
# the production host.
# Backups must be copied to an off-host target. Local backups on the same host
# are not disaster recovery.

# Non-loopback app CIDRs require a reachable listener address:
# postgresql_listen_addresses: "10.20.0.5"

mariadb_app_password: "{{ secret_mariadb_app_password | mandatory }}"
mariadb_tls_mode: provided
mariadb_backup_enabled: true
# Tune innodb_buffer_pool_size and max_connections for the production host.

storage_s3_endpoint: "http://127.0.0.1:3900"
storage_s3_region: "garage"
storage_s3_bucket: "elasticsearch-snapshots"
storage_s3_access_key: "{{ secret_storage_s3_access_key | mandatory }}"
storage_s3_secret_key: "{{ secret_storage_s3_secret_key | mandatory }}"

garage_rpc_secret: "{{ secret_garage_rpc_secret | mandatory }}"
garage_admin_token: "{{ secret_garage_admin_token | mandatory }}"
# Set this to the intended Garage data capacity on the production host.
garage_node_capacity_bytes: 10737418240

elasticsearch_bootstrap_password: "{{ secret_elasticsearch_bootstrap_password | mandatory }}"
elasticsearch_tls_mode: provided
elasticsearch_heap_size: "1g"
elasticsearch_manage_sysctl: true
# Tune the heap and Elasticsearch settings for the production host.
# Garage snapshots are local to this host; copy backups off-host.

nginx_certificate_mode: letsencrypt
# REQUIRED: replace with the Cloudflare-managed domain.
nginx_base_domain: "storage.example.com"
# REQUIRED: replace with the Let's Encrypt account email.
nginx_letsencrypt_email: "admin@example.com"
# REQUIRED: restrict 443 to private or VPN networks.
nginx_allowed_cidrs: []
nginx_cloudflare_api_token: "{{ secret_nginx_cloudflare_api_token | mandatory }}"

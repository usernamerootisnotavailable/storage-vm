---
# Environment metadata. Never used to branch role logic.
deployment_environment: prod

# Security-critical production settings are explicit even where they match
# secure role defaults.
common_manage_time: true
common_firewall_enabled: true
common_require_selinux: true

# REQUIRED: set the operator and automation source CIDRs before deployment.
# The common role refuses to configure firewalld while this list is empty.
common_firewall_allowed_ssh_cidrs: []

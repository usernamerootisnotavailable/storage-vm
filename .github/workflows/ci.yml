---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
  ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/collections

jobs:
  lint:
    name: Lint, policy, and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Lint YAML
        run: yamllint .
      - name: Lint Ansible
        run: ansible-lint
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh docker/dev/entrypoint.sh
      - name: Check policy
        run: ./scripts/check-policy.sh
      - name: Syntax-check playbooks
        run: |
          for playbook in site.yml playbooks/*.yml; do
            ansible-playbook -i inventories/dev/hosts.yml "${playbook}" --syntax-check
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep 'linux_x64.tar.gz' "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod 0755 gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --verbose

  molecule:
    name: Molecule (${{ matrix.role }})
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - postgresql
          - mariadb
          - garage
          - elasticsearch
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Build the AlmaLinux 10 test image
        run: docker build -t storage-host/almalinux10-ansible:10 docker/dev
      - name: Run the Molecule scenario
        working-directory: roles/${{ matrix.role }}
        run: molecule test

  integration:
    name: Full-stack integration
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 75
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run the integration test
        run: ./scripts/integration-test.sh

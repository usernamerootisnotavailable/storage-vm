---
- name: Check for the Elasticsearch keystore
  ansible.builtin.stat:
    path: "{{ elasticsearch_config_dir }}/elasticsearch.keystore"
  register: elasticsearch_keystore_file

- name: Create the Elasticsearch keystore
  ansible.builtin.command:
    argv:
      - /usr/share/elasticsearch/bin/elasticsearch-keystore
      - create
  environment:
    ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
  when: not elasticsearch_keystore_file.stat.exists
  changed_when: true

- name: Ensure the Elasticsearch keystore is owned by the service user
  ansible.builtin.file:
    path: "{{ elasticsearch_config_dir }}/elasticsearch.keystore"
    owner: elasticsearch
    group: elasticsearch
    mode: "0600"

- name: Read the Elasticsearch keystore
  ansible.builtin.command:
    argv:
      - /usr/share/elasticsearch/bin/elasticsearch-keystore
      - list
  become: true
  become_user: elasticsearch
  environment:
    ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
  register: elasticsearch_keystore
  changed_when: false
  check_mode: false

- name: Set the elastic bootstrap password
  when: "'bootstrap.password' not in elasticsearch_keystore.stdout"
  block:
    # The shell is needed only to capture stderr for a safe failure message.
    - name: Write the bootstrap password to the keystore
      ansible.builtin.shell:
        cmd: |
          /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password \
            2>/var/tmp/elasticsearch-keystore.err
          rc=$?
          if [ "${rc}" -eq 0 ]; then
            rm -f /var/tmp/elasticsearch-keystore.err
          fi
          exit "${rc}"
      args:
        stdin: "{{ elasticsearch_bootstrap_password }}"
      environment:
        ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
      changed_when: true
      no_log: true
      notify: Restart elasticsearch

  rescue:
    - name: Read the keystore error
      ansible.builtin.command:
        argv:
          - cat
          - /var/tmp/elasticsearch-keystore.err
      register: elasticsearch_keystore_error
      changed_when: false

    - name: Report the keystore error
      ansible.builtin.fail:
        msg: >-
          elasticsearch-keystore failed:
          {{ elasticsearch_keystore_error.stdout | default('no stderr')
             | replace(elasticsearch_bootstrap_password, '<redacted>') }}

- name: Set the Garage S3 access key
  ansible.builtin.command:
    argv:
      - /usr/share/elasticsearch/bin/elasticsearch-keystore
      - add
      - -f
      - -x
      - s3.client.default.access_key
  args:
    stdin: "{{ elasticsearch_s3_access_key }}"
  environment:
    ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
  changed_when: true
  no_log: true
  notify: Restart elasticsearch
  when:
    - elasticsearch_snapshot_repo_enabled | bool
    - >-
      elasticsearch_rotate_s3_secrets | bool or
      's3.client.default.access_key' not in elasticsearch_keystore.stdout

- name: Set the Garage S3 secret key
  ansible.builtin.command:
    argv:
      - /usr/share/elasticsearch/bin/elasticsearch-keystore
      - add
      - -f
      - -x
      - s3.client.default.secret_key
  args:
    stdin: "{{ elasticsearch_s3_secret_key }}"
  environment:
    ES_PATH_CONF: "{{ elasticsearch_config_dir }}"
  changed_when: true
  no_log: true
  notify: Restart elasticsearch
  when:
    - elasticsearch_snapshot_repo_enabled | bool
    - >-
      elasticsearch_rotate_s3_secrets | bool or
      's3.client.default.secret_key' not in elasticsearch_keystore.stdout

- name: Ensure the modified Elasticsearch keystore is owned by the service user
  ansible.builtin.file:
    path: "{{ elasticsearch_config_dir }}/elasticsearch.keystore"
    owner: elasticsearch
    group: elasticsearch
    mode: "0600"

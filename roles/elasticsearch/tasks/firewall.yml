---
- name: Allow Elasticsearch HTTP from approved source CIDRs
  when:
    - elasticsearch_manage_firewall | bool
    - elasticsearch_allowed_cidrs | length > 0
  block:
    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: Add Elasticsearch HTTP firewall rules
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port protocol="tcp" port="{{ elasticsearch_http_port }}" accept
        zone: "{{ elasticsearch_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ elasticsearch_allowed_cidrs }}"
      loop_control:
        label: "{{ item }}"

---
driver:
  name: docker

platforms:
  - name: elasticsearch-instance
    image: storage-host/almalinux10-ansible:10
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        elasticsearch_version: "9.5.6"
        common_manage_time: false
        common_firewall_enabled: false
        common_require_selinux: false
        elasticsearch_manage_firewall: false
        elasticsearch_allowed_cidrs: []
        elasticsearch_manage_sysctl: false
        elasticsearch_heap_size: "512m"
        elasticsearch_snapshot_repo_enabled: false
        elasticsearch_bootstrap_password: >-
          {{ lookup('password', '/tmp/storage-host-molecule-elasticsearch length=64 chars=hexdigits') }}
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

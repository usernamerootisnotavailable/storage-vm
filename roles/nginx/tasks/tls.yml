---
- name: Check for stale Certbot renewal units
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/certbot-renew.timer
    - /etc/systemd/system/certbot-renew.service
  register: nginx_stale_certbot_units

- name: Remove stale Certbot renewal units in generated mode
  when:
    - nginx_certificate_mode == 'generated'
    - nginx_stale_certbot_units.results | selectattr('stat.exists') | list | length > 0
  block:
    - name: Stop and disable the stale Certbot renewal timer
      ansible.builtin.systemd_service:
        name: certbot-renew.timer
        enabled: false
        state: stopped
      when: nginx_stale_certbot_units.results[0].stat.exists

    - name: Remove the stale Certbot renewal unit files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/certbot-renew.timer
        - /etc/systemd/system/certbot-renew.service

    - name: Reload systemd after removing Certbot units
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Generate the development TLS material
  when: nginx_certificate_mode == 'generated'
  block:
    - name: Generate the NGINX development CA private key
      community.crypto.openssl_privatekey:
        path: "{{ nginx_tls_dir }}/ca.key"
        type: RSA
        size: 2048
        owner: root
        group: root
        mode: "0600"

    - name: Generate the NGINX development CA certificate signing request
      community.crypto.openssl_csr:
        path: "{{ nginx_tls_dir }}/ca.csr"
        privatekey_path: "{{ nginx_tls_dir }}/ca.key"
        common_name: "{{ nginx_certificate_common_name }}-ca"
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        owner: root
        group: root
        mode: "0644"

    - name: Generate the NGINX development CA certificate
      community.crypto.x509_certificate:
        path: "{{ nginx_tls_ca_path }}"
        csr_path: "{{ nginx_tls_dir }}/ca.csr"
        privatekey_path: "{{ nginx_tls_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+{{ nginx_generated_ca_validity_days }}d"
        owner: root
        group: root
        mode: "0644"

    - name: Generate the NGINX development server private key
      community.crypto.openssl_privatekey:
        path: "{{ nginx_tls_key_path }}"
        type: RSA
        size: 2048
        owner: root
        group: root
        mode: "0600"
      notify: Reload nginx

    - name: Generate the NGINX development server certificate signing request
      community.crypto.openssl_csr:
        path: "{{ nginx_tls_dir }}/server.csr"
        privatekey_path: "{{ nginx_tls_key_path }}"
        common_name: "{{ nginx_certificate_common_name }}"
        subject_alt_name: "{{ nginx_certificate_expected_sans + ['IP:127.0.0.1'] }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth
        owner: root
        group: root
        mode: "0644"

    - name: Generate the NGINX development server certificate
      community.crypto.x509_certificate:
        path: "{{ nginx_tls_cert_path }}"
        csr_path: "{{ nginx_tls_dir }}/server.csr"
        privatekey_path: "{{ nginx_tls_key_path }}"
        provider: ownca
        ownca_path: "{{ nginx_tls_ca_path }}"
        ownca_privatekey_path: "{{ nginx_tls_dir }}/ca.key"
        ownca_not_after: "+{{ nginx_certificate_validity_days }}d"
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

---
driver:
  name: docker

platforms:
  - name: postgresql-instance
    image: storage-host/almalinux10-ansible:10
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../roles"
  inventory:
    group_vars:
      all:
        postgresql_version: "18"
        common_manage_time: false
        common_firewall_enabled: false
        common_require_selinux: false
        common_ssh_allow_users:
          - ansible
        postgresql_manage_firewall: false
        postgresql_allowed_cidrs: []
        postgresql_app_password: >-
          {{ lookup('password', '/tmp/storage-host-molecule-postgresql length=32 chars=ascii_letters,digits') }}
        postgresql_tls_mode: generated
        postgresql_backup_enabled: true
        postgresql_backup_dir: /var/backups/postgresql
        postgresql_backup_on_calendar: "*-*-* 03:00:00"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

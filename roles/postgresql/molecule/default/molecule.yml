---
driver:
  name: docker

platforms:
  - name: postgresql-instance
    image: storage-host/almalinux10-ansible:10
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../roles"
  inventory:
    group_vars:
      all:
        postgresql_version: "18"
        common_manage_time: false
        common_firewall_enabled: false
        common_require_selinux: false
        common_verify_automation_key: false
        common_ssh_allow_users:
          - ansible
        postgresql_manage_firewall: false
        postgresql_apps:
          - state: present
            name: app
            user: app
            password: >-
              {{ lookup('password', '/tmp/mol-pg-app length=32 chars=ascii_letters,digits') }}
            databases:
              - appdb
            cidrs:
              - 127.0.0.1/32
              - ::1/128
            extensions: []
            connection_limit: 100
            rotate_password: false
          - state: present
            name: analytics
            user: analytics
            password: >-
              {{ lookup('password', '/tmp/mol-pg-analytics length=32 chars=ascii_letters,digits') }}
            databases:
              - analyticsdb
            cidrs:
              - 127.0.0.1/32
            extensions: []
            connection_limit: 20
            rotate_password: false
        postgresql_tls_mode: generated
        postgresql_backup_enabled: true
        postgresql_backup_dir: /var/backups/postgresql
        postgresql_backup_on_calendar: "*-*-* 03:00:00"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

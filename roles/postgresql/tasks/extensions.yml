---
- name: Create requested PostgreSQL extensions in each application database
  community.postgresql.postgresql_ext:
    name: "{{ item.0 }}"
    login_db: "{{ item.1 }}"
    login_unix_socket: "{{ postgresql_socket_dir }}"
    state: present
  loop: >-
    {{ postgresql_app.extensions | default([])
       | product(postgresql_app.databases) | list }}
  loop_control:
    label: "{{ item.0 }} in {{ item.1 }}"
  become: true
  become_user: postgres

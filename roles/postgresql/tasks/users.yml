---
- name: Create PostgreSQL application access
  when: not ansible_check_mode
  block:
    - name: Create PostgreSQL application roles
      community.postgresql.postgresql_user:
        name: "{{ item.user }}"
        password: "{{ item.password }}"
        role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
        conn_limit: "{{ item.connection_limit | default(-1) }}"
        no_password_changes: "{{ not (item.rotate_password | default(false) | bool) }}"
        login_unix_socket: "{{ postgresql_socket_dir }}"
        state: present
      loop: "{{ postgresql_present_apps }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: postgres
      no_log: true

    # community.postgresql skips conn_limit when no_password_changes is true.
    # Enforce the role flags and limit without passing a password so
    # rotate_password: false still preserves the existing credential.
    - name: Enforce PostgreSQL application role attributes and connection limits
      community.postgresql.postgresql_user:
        name: "{{ item.user }}"
        role_attr_flags: "LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE"
        conn_limit: "{{ item.connection_limit | default(-1) }}"
        no_password_changes: false
        login_unix_socket: "{{ postgresql_socket_dir }}"
        state: present
      loop: "{{ postgresql_present_apps_redacted }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      become_user: postgres
      when: not (item.rotate_password | default(false) | bool)

    - name: Create PostgreSQL application databases
      community.postgresql.postgresql_db:
        name: "{{ item.1 }}"
        owner: "{{ item.0.user }}"
        encoding: UTF8
        login_unix_socket: "{{ postgresql_socket_dir }}"
        state: present
      loop: "{{ postgresql_present_apps_redacted | subelements('databases') }}"
      loop_control:
        label: "{{ item.0.name }}:{{ item.1 }}"
      become: true
      become_user: postgres

    - name: Create requested PostgreSQL extensions
      ansible.builtin.include_tasks: extensions.yml
      loop: "{{ postgresql_present_apps_redacted }}"
      loop_control:
        loop_var: postgresql_app
        label: "{{ postgresql_app.name }}"
      when: postgresql_app.extensions | default([]) | length > 0

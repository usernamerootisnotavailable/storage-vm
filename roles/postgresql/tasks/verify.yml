---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Verify PostgreSQL is running
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(postgresql_service_name ~ '.service', {}).get('state', '') == 'running'
    fail_msg: PostgreSQL is not running.
    quiet: true

- name: Verify PostgreSQL accepts connections
  ansible.builtin.command:
    argv:
      - "{{ postgresql_bin_dir }}/pg_isready"
      - -h
      - 127.0.0.1
      - -p
      - "{{ postgresql_port }}"
  changed_when: false
  when: not ansible_check_mode

- name: Verify the application connection over the configured transport
  community.postgresql.postgresql_query:
    login_host: 127.0.0.1
    login_port: "{{ postgresql_port }}"
    login_user: "{{ postgresql_app_user }}"
    login_password: "{{ postgresql_app_password }}"
    login_db: "{{ postgresql_app_database }}"
    query: >-
      SELECT current_database() AS database,
             current_user AS username,
             (SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()) AS ssl
  environment:
    PGSSLMODE: "{{ 'require' if postgresql_tls_enabled else 'disable' }}"
  register: postgresql_app_check
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Assert the application connection is correct
  ansible.builtin.assert:
    that:
      - postgresql_app_check.query_result[0].database == postgresql_app_database
      - postgresql_app_check.query_result[0].username == postgresql_app_user
      - (postgresql_app_check.query_result[0].ssl | bool) == (postgresql_tls_enabled | bool)
    fail_msg: The application connection did not use the expected database, role, or TLS mode.
    quiet: true
  when: not ansible_check_mode

- name: Verify the application database owner
  community.postgresql.postgresql_query:
    login_unix_socket: "{{ postgresql_socket_dir }}"
    query: >-
      SELECT pg_get_userbyid(datdba) AS owner
      FROM pg_database
      WHERE datname = %s
    positional_args:
      - "{{ postgresql_app_database }}"
  become: true
  become_user: postgres
  register: postgresql_database_check
  changed_when: false
  when: not ansible_check_mode

- name: Assert the application database owner is correct
  ansible.builtin.assert:
    that:
      - postgresql_database_check.query_result | length == 1
      - postgresql_database_check.query_result[0].owner | default('') == postgresql_app_user
    fail_msg: The application database is missing or has the wrong owner.
    quiet: true
  when: not ansible_check_mode

- name: Verify the TLS files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ postgresql_tls_cert_path }}"
    - "{{ postgresql_tls_key_path }}"
  register: postgresql_tls_check
  when: postgresql_tls_enabled | bool

- name: Assert the TLS files are present
  ansible.builtin.assert:
    that:
      - postgresql_tls_check.results[0].stat.exists
      - postgresql_tls_check.results[1].stat.exists
      - postgresql_tls_check.results[1].stat.mode | default('') in ['0600', '0640']
    fail_msg: PostgreSQL TLS files are missing or the key permissions are unsafe.
    quiet: true
  when: postgresql_tls_enabled | bool

- name: Verify the backup timer
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ postgresql_backup_timer_name }}"
  register: postgresql_backup_timer_check
  changed_when: false
  when:
    - postgresql_backup_enabled | bool
    - not ansible_check_mode

- name: Assert the backup timer is enabled
  ansible.builtin.assert:
    that:
      - postgresql_backup_timer_check.stdout == 'enabled'
    fail_msg: The PostgreSQL backup timer is not enabled.
    quiet: true
  when:
    - postgresql_backup_enabled | bool
    - not ansible_check_mode

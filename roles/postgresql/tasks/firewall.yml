---
- name: Allow PostgreSQL from approved source CIDRs
  when:
    - postgresql_manage_firewall | bool
    - postgresql_allowed_cidrs | length > 0
  block:
    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: Add PostgreSQL firewall rules
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port protocol="tcp" port="{{ postgresql_port }}" accept
        zone: "{{ postgresql_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ postgresql_allowed_cidrs }}"
      loop_control:
        label: "{{ item }}"

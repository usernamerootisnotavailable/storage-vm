---
argument_specs:
  main:
    short_description: Install and configure PostgreSQL 18
    description:
      - Installs PostgreSQL from PGDG, configures TLS and SCRAM authentication,
        creates application roles, databases, and extensions, and installs a
        backup timer.
    options:
      postgresql_version:
        type: str
        required: true
        description: PostgreSQL major version, pinned in inventory.
      postgresql_port:
        type: int
        description: Listener port.
      postgresql_listen_addresses:
        type: str
        description: Comma-separated listener addresses.
      postgresql_manage_firewall:
        type: bool
        description: Manage firewalld rules when client CIDRs are set.
      postgresql_firewall_zone:
        type: str
        description: firewalld zone to manage.
      postgresql_pgdg_baseurl:
        type: str
        description: PGDG repository base URL.
      postgresql_pgdg_gpgkey:
        type: str
        description: PGDG signing key URL.
      postgresql_pgdg_gpgkey_checksum:
        type: str
        description: SHA256 checksum of the PGDG signing key.
      postgresql_pgdg_gpgkey_path:
        type: str
        description: Local path for the PGDG signing key.
      postgresql_packages:
        type: list
        elements: str
        description: Packages required by the role.
      postgresql_data_dir:
        type: str
        description: PostgreSQL data directory.
      postgresql_bin_dir:
        type: str
        description: PostgreSQL binary directory.
      postgresql_service_name:
        type: str
        description: systemd service name.
      postgresql_socket_dir:
        type: str
        description: Unix socket directory.
      postgresql_apps:
        type: list
        elements: dict
        description:
          - External applications. Each present app receives a role, its
            databases, requested extensions, per-database HBA rules, and
            firewall exposure from its CIDRs.
          - Absent apps remove HBA and firewall access only. The role and
            databases are not dropped.
        options:
          state:
            type: str
            required: true
            choices:
              - present
              - absent
            description: Whether access is present or removed.
          name:
            type: str
            required: true
            description: Unique lowercase application name.
          user:
            type: str
            required: true
            description: Unique lowercase PostgreSQL role name.
          password:
            type: str
            required: true
            no_log: true
            description: Application password from SOPS, at least 16 characters.
          databases:
            type: list
            elements: str
            required: true
            description: Non-empty list of unique lowercase database names.
          cidrs:
            type: list
            elements: str
            required: true
            description: Non-empty list of source CIDRs. Default routes are forbidden.
          extensions:
            type: list
            elements: str
            default: []
            description: Extensions to create in every database for this app.
          connection_limit:
            type: int
            default: -1
            description: PostgreSQL connection limit; must be -1 or greater.
          rotate_password:
            type: bool
            default: false
            description: Allow the password of an existing role to be updated.
      postgresql_max_connections:
        type: int
        description: Maximum connections.
      postgresql_shared_buffers:
        type: str
        description: Shared buffer size.
      postgresql_effective_cache_size:
        type: str
        description: Planner cache estimate.
      postgresql_maintenance_work_mem:
        type: str
        description: Maintenance memory.
      postgresql_work_mem:
        type: str
        description: Per-operation memory.
      postgresql_wal_level:
        type: str
        description: WAL level.
      postgresql_password_encryption:
        type: str
        description: Password hashing algorithm.
      postgresql_log_min_duration_statement:
        type: int
        description: Slow query threshold in milliseconds.
      postgresql_timezone:
        type: str
        description: Database timezone.
      postgresql_tls_enabled:
        type: bool
        description: Enable TLS.
      postgresql_tls_mode:
        type: str
        choices:
          - generated
          - provided
        description: Generate a self-signed certificate or use provided files.
      postgresql_tls_dir:
        type: str
        description: TLS directory.
      postgresql_tls_cert_path:
        type: str
        description: TLS certificate path.
      postgresql_tls_key_path:
        type: str
        description: TLS private key path.
      postgresql_tls_common_name:
        type: str
        description: Generated certificate common name.
      postgresql_tls_sans:
        type: list
        elements: str
        description: Generated certificate subject alternative names.
      postgresql_tls_key_size:
        type: int
        description: Generated RSA key size.
      postgresql_tls_cert_validity_days:
        type: int
        description: Generated certificate validity in days.
      postgresql_tls_min_protocol:
        type: str
        description: Minimum TLS protocol version.
      postgresql_backup_enabled:
        type: bool
        description: Install the local logical backup timer.
      postgresql_backup_dir:
        type: str
        description: Local backup directory.
      postgresql_backup_retention_days:
        type: int
        description: Local backup retention.
      postgresql_backup_on_calendar:
        type: str
        description: systemd timer schedule.
      postgresql_backup_script_path:
        type: str
        description: Backup script path.
      postgresql_backup_service_name:
        type: str
        description: Backup service name.
      postgresql_backup_timer_name:
        type: str
        description: Backup timer name.

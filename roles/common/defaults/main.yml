---
common_timezone: UTC

common_packages:
  - chrony
  - dnf-plugins-core
  - firewalld
  - gzip
  - libselinux-utils
  - openssh-server
  - policycoreutils-python-utils
  - python3-cryptography
  - python3-firewall
  - python3-libselinux
  - sudo
  - tar
  - tzdata

common_manage_time: true
common_chrony_servers:
  - 0.almalinux.pool.ntp.org
  - 1.almalinux.pool.ntp.org

common_firewall_enabled: true
common_firewall_zone: public
common_firewall_allowed_ssh_cidrs: []

common_require_selinux: true

# The image-provided bootstrap account. Cloud-init owns its key and the image
# owns its passwordless sudo rule. The role verifies this account remains usable
# and refuses to manage it as a regular administrator.
common_automation_user: ansible
common_verify_automation_key: true

common_admin_users: []

common_ssh_service_name: sshd
common_ssh_config_file: /etc/ssh/sshd_config.d/99-storage-host.conf
common_ssh_permit_root_login: "no"
common_ssh_password_authentication: "no"
common_ssh_allow_users:
  - "{{ common_automation_user }}"
common_ssh_max_auth_tries: 3
common_ssh_login_grace_time: 30
common_ssh_client_alive_interval: 300
common_ssh_client_alive_count_max: 2

common_journald_storage: persistent
common_journald_system_max_use: 1G
common_journald_rate_limit_interval: 30s
common_journald_rate_limit_burst: 10000

---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Verify the SSH service is running
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.services.get(common_ssh_service_name ~ '.service', {}).get('state', '')
        == 'running'
    fail_msg: The SSH service is not running.
    quiet: true

- name: Verify the SSH configuration exists
  ansible.builtin.stat:
    path: "{{ common_ssh_config_file }}"
  register: common_ssh_config_stat

- name: Assert the SSH configuration is present
  ansible.builtin.assert:
    that:
      - common_ssh_config_stat.stat.exists
      - common_ssh_config_stat.stat.mode | default('') == '0644'
    fail_msg: The managed SSH configuration is missing or has the wrong mode.
    quiet: true

- name: Read the SSH hardening file
  ansible.builtin.slurp:
    src: "{{ common_ssh_config_file }}"
  register: common_sshd_config

- name: Assert the SSH policy is applied
  ansible.builtin.assert:
    that:
      - "('PermitRootLogin ' ~ common_ssh_permit_root_login) in (common_sshd_config.content | b64decode)"
      - "('PasswordAuthentication ' ~ common_ssh_password_authentication) in (common_sshd_config.content | b64decode)"
      - "'AllowUsers' in (common_sshd_config.content | b64decode)"
    fail_msg: The SSH hardening policy is incomplete.
    quiet: true

- name: Read the image-managed automation account
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ common_automation_user }}"
  register: common_automation_account
  changed_when: false
  check_mode: false

- name: Assert the image-managed automation account exists
  ansible.builtin.assert:
    that:
      - common_automation_account.rc == 0
    fail_msg: >-
      The image-managed automation account {{ common_automation_user }} is
      missing. The common role must not break the bootstrap account.
    quiet: true

- name: Assert the image-managed automation account uses a login shell
  ansible.builtin.assert:
    that:
      - common_automation_account.stdout.split(':')[6] == '/bin/bash'
    fail_msg: >-
      The image-managed automation account {{ common_automation_user }} no
      longer uses a login shell. The common role must not break the bootstrap
      account.
    quiet: true
  when: common_automation_account.rc == 0

- name: Inspect the automation account SSH key
  ansible.builtin.stat:
    path: "/home/{{ common_automation_user }}/.ssh/authorized_keys"
  register: common_automation_key
  when: common_verify_automation_key | bool

- name: Assert the automation account SSH key is present
  ansible.builtin.assert:
    that:
      - common_automation_key.stat.exists
      - common_automation_key.stat.size | default(0) | int > 0
      - common_automation_key.stat.pw_name | default('') == common_automation_user
    fail_msg: >-
      The image-managed automation account has no usable authorized key. The
      common role must not remove the cloud-init key.
    quiet: true
  when: common_verify_automation_key | bool

- name: Verify passwordless sudo for the automation account
  ansible.builtin.command:
    argv:
      - sudo
      - -n
      - "true"
  become: true
  become_user: "{{ common_automation_user }}"
  changed_when: false
  check_mode: false

- name: Verify the managed timezone
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - /etc/localtime
  register: common_timezone_link
  changed_when: false
  check_mode: false

- name: Assert the timezone is correct
  ansible.builtin.assert:
    that:
      - common_timezone in common_timezone_link.stdout
    fail_msg: "Expected timezone {{ common_timezone }}, found {{ common_timezone_link.stdout }}."
    quiet: true

- name: Verify chronyd when time management is enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get('chronyd.service', {}).get('state', '') == 'running'
    fail_msg: chronyd is not running.
    quiet: true
  when: common_manage_time | bool

- name: Verify firewalld when firewall management is enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get('firewalld.service', {}).get('state', '') == 'running'
    fail_msg: firewalld is not running.
    quiet: true
  when: common_firewall_enabled | bool

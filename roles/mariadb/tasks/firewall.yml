---
- name: Manage MariaDB firewall access
  when:
    - mariadb_manage_firewall | bool
    - >-
      mariadb_client_cidrs | length > 0 or
      mariadb_absent_only_client_cidrs | length > 0
  block:
    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: Add MariaDB firewall rules for present clients
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port protocol="tcp" port="{{ mariadb_port }}" accept
        zone: "{{ mariadb_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ mariadb_client_cidrs }}"
      loop_control:
        label: "{{ item }}"

    - name: Remove MariaDB firewall rules for absent clients
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port protocol="tcp" port="{{ mariadb_port }}" accept
        zone: "{{ mariadb_firewall_zone }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ mariadb_absent_only_client_cidrs }}"
      loop_control:
        label: "{{ item }}"

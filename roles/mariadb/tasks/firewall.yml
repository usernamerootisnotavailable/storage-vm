---
- name: Allow MariaDB from approved source CIDRs
  when:
    - mariadb_manage_firewall | bool
    - mariadb_allowed_cidrs | length > 0
  block:
    - name: Ensure firewalld is running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: Add MariaDB firewall rules
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="{{ 'ipv6' if ':' in item else 'ipv4' }}"
          source address="{{ item }}"
          port protocol="tcp" port="{{ mariadb_port }}" accept
        zone: "{{ mariadb_firewall_zone }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ mariadb_allowed_cidrs }}"
      loop_control:
        label: "{{ item }}"

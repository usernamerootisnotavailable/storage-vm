---
- name: Download the MariaDB signing key
  ansible.builtin.get_url:
    url: "{{ mariadb_gpgkey_url }}"
    dest: "{{ mariadb_gpgkey_path }}"
    checksum: "{{ mariadb_gpgkey_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Import the MariaDB signing key
  ansible.builtin.rpm_key:
    key: "{{ mariadb_gpgkey_path }}"
    state: present

- name: Configure the MariaDB repository
  ansible.builtin.yum_repository:
    name: "{{ mariadb_repo_name }}"
    description: "MariaDB {{ mariadb_version }} for AlmaLinux 10"
    baseurl: "{{ mariadb_repo_baseurl }}"
    gpgcheck: true
    gpgkey: "file://{{ mariadb_gpgkey_path }}"
    enabled: true
    module_hotfixes: true

- name: Install MariaDB packages
  ansible.builtin.dnf:
    name: "{{ mariadb_packages }}"
    state: present

- name: Ensure the MariaDB data directory exists
  ansible.builtin.file:
    path: "{{ mariadb_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0700"

- name: Ensure the MariaDB log directory exists
  ansible.builtin.file:
    path: "{{ mariadb_log_dir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0700"

- name: Initialize the MariaDB data directory
  ansible.builtin.command:
    argv:
      - /usr/bin/mariadb-install-db
      - --user=mysql
      - --datadir={{ mariadb_datadir }}
      - --auth-root-authentication-method=socket
    creates: "{{ mariadb_datadir }}/mysql"

---
- name: Harden MariaDB and create application access
  when: not ansible_check_mode
  block:
    - name: Read the root authentication plugin
      ansible.mariadb.mariadb_query:
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root
        query: >-
          SELECT plugin
          FROM mysql.user
          WHERE User = 'root' AND Host = 'localhost'
      register: mariadb_root_plugin
      changed_when: false
      no_log: true

    - name: Require unix_socket authentication for local root
      ansible.mariadb.mariadb_query:
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root
        query: "ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket"
      when: mariadb_root_plugin.query_result[0][0].plugin | default('') != 'unix_socket'
      changed_when: true
      no_log: true

    - name: Find anonymous MariaDB accounts
      ansible.mariadb.mariadb_query:
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root
        query: "SELECT User, Host FROM mysql.user WHERE User = ''"
      register: mariadb_anonymous_users
      changed_when: false

    - name: Remove anonymous MariaDB accounts
      ansible.mariadb.mariadb_query:
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root
        query: "DROP USER IF EXISTS ''@'{{ item.Host }}'"
      loop: "{{ mariadb_anonymous_users.query_result[0] }}"
      loop_control:
        label: "{{ item.User }}@{{ item.Host }}"
      when: mariadb_anonymous_users.query_result[0] | length > 0
      changed_when: true

    - name: Remove remote root accounts
      ansible.mariadb.mariadb_user:
        name: root
        host: "%"
        state: absent
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root

    - name: Remove the test database
      ansible.mariadb.mariadb_db:
        name: test
        state: absent
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root

    - name: Create MariaDB application databases
      ansible.mariadb.mariadb_db:
        name: "{{ item.1 }}"
        encoding: "{{ mariadb_character_set }}"
        collation: "{{ mariadb_collation }}"
        login_unix_socket: "{{ mariadb_socket }}"
        login_user: root
        state: present
      loop: "{{ mariadb_present_apps_redacted | subelements('databases') }}"
      loop_control:
        label: "{{ item.0.name }}:{{ item.1 }}"

    - name: Create MariaDB application accounts
      ansible.builtin.include_tasks: users-app.yml
      loop: "{{ mariadb_present_apps }}"
      loop_control:
        loop_var: mariadb_app
        label: "{{ mariadb_app.name }}"

    - name: Remove database grants for absent MariaDB applications
      ansible.builtin.include_tasks: revoke-app.yml
      loop: "{{ mariadb_absent_apps_redacted }}"
      loop_control:
        loop_var: mariadb_absent_app
        label: "{{ mariadb_absent_app.name }}"

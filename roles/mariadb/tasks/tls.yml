---
- name: Ensure the TLS directory exists
  ansible.builtin.file:
    path: "{{ mariadb_tls_dir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0700"

- name: Configure generated TLS material
  when: mariadb_tls_mode == 'generated'
  block:
    - name: Generate the MariaDB CA private key
      community.crypto.openssl_privatekey:
        path: "{{ mariadb_tls_dir }}/ca.key"
        type: RSA
        size: "{{ mariadb_tls_key_size }}"
        owner: root
        group: root
        mode: "0600"

    - name: Generate the MariaDB CA certificate signing request
      community.crypto.openssl_csr:
        path: "{{ mariadb_tls_dir }}/ca.csr"
        privatekey_path: "{{ mariadb_tls_dir }}/ca.key"
        common_name: "{{ mariadb_tls_common_name }}-ca"
        basic_constraints:
          - "CA:TRUE"
        basic_constraints_critical: true
        key_usage:
          - keyCertSign
          - cRLSign
        owner: root
        group: root
        mode: "0644"

    - name: Generate the MariaDB CA certificate
      community.crypto.x509_certificate:
        path: "{{ mariadb_tls_ca_path }}"
        csr_path: "{{ mariadb_tls_dir }}/ca.csr"
        privatekey_path: "{{ mariadb_tls_dir }}/ca.key"
        provider: selfsigned
        selfsigned_not_after: "+{{ mariadb_tls_ca_validity_days }}d"
        owner: root
        group: mysql
        mode: "0644"

    - name: Generate the MariaDB server private key
      community.crypto.openssl_privatekey:
        path: "{{ mariadb_tls_key_path }}"
        type: RSA
        size: "{{ mariadb_tls_key_size }}"
        owner: mysql
        group: mysql
        mode: "0600"
      notify: Restart mariadb

    - name: Generate the MariaDB server certificate signing request
      community.crypto.openssl_csr:
        path: "{{ mariadb_tls_dir }}/server.csr"
        privatekey_path: "{{ mariadb_tls_key_path }}"
        common_name: "{{ mariadb_tls_common_name }}"
        subject_alt_name: "{{ mariadb_tls_sans }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth
        owner: root
        group: root
        mode: "0644"

    - name: Generate the MariaDB server certificate
      community.crypto.x509_certificate:
        path: "{{ mariadb_tls_cert_path }}"
        csr_path: "{{ mariadb_tls_dir }}/server.csr"
        privatekey_path: "{{ mariadb_tls_key_path }}"
        provider: ownca
        ownca_path: "{{ mariadb_tls_ca_path }}"
        ownca_privatekey_path: "{{ mariadb_tls_dir }}/ca.key"
        ownca_not_after: "+{{ mariadb_tls_cert_validity_days }}d"
        owner: root
        group: mysql
        mode: "0644"
      notify: Restart mariadb

- name: Validate provided TLS material
  when: mariadb_tls_mode == 'provided'
  block:
    - name: Inspect the provided TLS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ mariadb_tls_ca_path }}"
        - "{{ mariadb_tls_cert_path }}"
        - "{{ mariadb_tls_key_path }}"
      register: mariadb_tls_provided

    - name: Require provided TLS files with safe ownership and permissions
      ansible.builtin.assert:
        that:
          - mariadb_tls_provided.results[0].stat.exists
          - mariadb_tls_provided.results[1].stat.exists
          - mariadb_tls_provided.results[2].stat.exists
          - mariadb_tls_provided.results[0].stat.gr_name | default('') == 'mysql'
          - mariadb_tls_provided.results[1].stat.gr_name | default('') == 'mysql'
          - mariadb_tls_provided.results[2].stat.pw_name | default('') == 'mysql'
          - mariadb_tls_provided.results[2].stat.mode | default('') in ['0600', '0640']
        fail_msg: >-
          Provided TLS files must exist, be readable by mysql, and the private
          key must be owned by mysql with mode 0600 or 0640.
        quiet: true

---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Verify MariaDB is running
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get(mariadb_service_name ~ '.service', {}).get('state', '') == 'running'
    fail_msg: MariaDB is not running.
    quiet: true

- name: Verify MariaDB accepts connections
  ansible.builtin.command:
    argv:
      - /usr/bin/mariadb-admin
      - --socket={{ mariadb_socket }}
      - --user=root
      - ping
  changed_when: false
  when: not ansible_check_mode

- name: Read present MariaDB application databases
  ansible.mariadb.mariadb_query:
    login_unix_socket: "{{ mariadb_socket }}"
    login_user: root
    query: >-
      SELECT SCHEMA_NAME
      FROM information_schema.SCHEMATA
      WHERE SCHEMA_NAME = %s
    positional_args:
      - "{{ mariadb_present_database.1 }}"
  loop: "{{ mariadb_present_apps_redacted | subelements('databases') }}"
  loop_control:
    loop_var: mariadb_present_database
    label: "{{ mariadb_present_database.0.name }}:{{ mariadb_present_database.1 }}"
  register: mariadb_present_databases_check
  changed_when: false
  when: not ansible_check_mode

- name: Assert present MariaDB application databases exist
  ansible.builtin.assert:
    that:
      - (item.query_result[0] | length) == 1
    fail_msg: >-
      A present MariaDB application database is missing. Re-apply the role and
      inspect information_schema.SCHEMATA.
    quiet: true
  loop: "{{ mariadb_present_databases_check.results }}"
  loop_control:
    label: "{{ item.mariadb_present_database.0.name }}:{{ item.mariadb_present_database.1 }}"
  when: not ansible_check_mode

- name: Verify present MariaDB applications
  ansible.builtin.include_tasks: verify-app.yml
  loop: "{{ mariadb_present_apps_redacted }}"
  loop_control:
    loop_var: mariadb_app
    label: "{{ mariadb_app.name }}"
  when: not ansible_check_mode

- name: Verify absent MariaDB applications
  ansible.builtin.include_tasks: verify-absent-app.yml
  loop: "{{ mariadb_absent_apps_redacted }}"
  loop_control:
    loop_var: mariadb_absent_app
    label: "{{ mariadb_absent_app.name }}"
  when: not ansible_check_mode

- name: Verify the TLS files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ mariadb_tls_ca_path }}"
    - "{{ mariadb_tls_cert_path }}"
    - "{{ mariadb_tls_key_path }}"
  register: mariadb_tls_check

- name: Assert the TLS files are present
  ansible.builtin.assert:
    that:
      - mariadb_tls_check.results[0].stat.exists
      - mariadb_tls_check.results[1].stat.exists
      - mariadb_tls_check.results[2].stat.exists
      - mariadb_tls_check.results[2].stat.mode | default('') in ['0600', '0640']
    fail_msg: MariaDB TLS files are missing or the private key permissions are unsafe.
    quiet: true

- name: Verify the backup timer
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - "{{ mariadb_backup_timer_name }}"
  register: mariadb_backup_timer_check
  changed_when: false
  when:
    - mariadb_backup_enabled | bool
    - not ansible_check_mode

- name: Assert the backup timer is enabled
  ansible.builtin.assert:
    that:
      - mariadb_backup_timer_check.stdout == 'enabled'
    fail_msg: The MariaDB backup timer is not enabled.
    quiet: true
  when:
    - mariadb_backup_enabled | bool
    - not ansible_check_mode

---
driver:
  name: docker

platforms:
  - name: mariadb-instance
    image: storage-host/almalinux10-ansible:10
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../roles"
  inventory:
    group_vars:
      all:
        mariadb_version: "11.8.10"
        common_manage_time: false
        common_firewall_enabled: false
        common_require_selinux: false
        common_verify_automation_key: false
        mariadb_manage_firewall: false
        mariadb_apps:
          - state: present
            name: app
            user: app
            password: >-
              {{ lookup('password', '/tmp/mol-mariadb-app length=32 chars=ascii_letters,digits') }}
            databases:
              - appdb
            cidrs:
              - 127.0.0.1/32
          - state: present
            name: analytics
            user: analytics
            password: >-
              {{ lookup('password', '/tmp/mol-mariadb-analytics length=32 chars=ascii_letters,digits') }}
            databases:
              - analyticsdb
            cidrs:
              - 127.0.0.1/32
        mariadb_tls_mode: generated
        mariadb_backup_enabled: true
        mariadb_backup_dir: /var/backups/mariadb
        mariadb_backup_on_calendar: "*-*-* 03:15:00"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

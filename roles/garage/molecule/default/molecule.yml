---
driver:
  name: docker

platforms:
  - name: garage-instance
    image: storage-host/almalinux10-ansible:10
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
      - /run/lock

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        garage_version: "2.5.0"
        garage_binary_checksum: "sha256:2ff667286217cd73ebcb1c03af993822365000441dfe31a80cb64c5189a9dea8"
        common_manage_time: false
        common_firewall_enabled: false
        common_require_selinux: false
        garage_rpc_secret: >-
          {{ lookup('password', '/tmp/storage-host-molecule-garage-rpc length=64 chars=hexdigits') }}
        garage_admin_token: >-
          {{ lookup('password', '/tmp/storage-host-molecule-garage-admin length=64 chars=hexdigits') }}
        storage_s3_bucket: elasticsearch-snapshots
        storage_s3_access_key: >-
          {{ lookup('password', '/tmp/storage-host-molecule-s3-key length=16 chars=hexdigits') }}
        storage_s3_secret_key: >-
          {{ lookup('password', '/tmp/storage-host-molecule-s3-secret length=64 chars=hexdigits') }}
        garage_node_capacity_bytes: 1073741824
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

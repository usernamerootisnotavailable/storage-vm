---
# garage_version and garage_binary_checksum are required and pinned in
# inventory versions.yml.
garage_binary_url: >-
  https://garagehq.deuxfleurs.fr/_releases/v{{ garage_version }}/x86_64-unknown-linux-musl/garage
garage_bin: /usr/local/bin/garage
garage_config_path: /etc/garage.toml
garage_user: garage
garage_group: garage
garage_service_name: garage
garage_service_file: /etc/systemd/system/garage.service
garage_log_level: info

garage_data_dir: /var/lib/garage/data
garage_metadata_dir: /var/lib/garage/meta
garage_db_engine: lmdb
garage_replication_factor: 1
garage_consistency_mode: consistent

garage_rpc_bind_addr: "127.0.0.1:3901"
garage_rpc_public_addr: "127.0.0.1:3901"
garage_s3_api_bind_addr: "127.0.0.1:3900"
garage_s3_region: "{{ storage_s3_region | default('garage') }}"
garage_admin_bind_addr: "127.0.0.1:3903"
garage_admin_url: "http://{{ garage_admin_bind_addr }}"

garage_zone: dc1
garage_node_capacity_bytes: 1073741824

garage_manage_bucket: true
garage_s3_bucket: "{{ storage_s3_bucket | default('elasticsearch-snapshots') }}"
garage_s3_key_name: "{{ garage_s3_bucket }}"
garage_s3_access_key: "{{ storage_s3_access_key | default('') }}"
garage_s3_secret_key: "{{ storage_s3_secret_key | default('') }}"

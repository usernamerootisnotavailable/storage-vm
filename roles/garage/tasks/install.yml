---
- name: Download the Garage binary
  ansible.builtin.get_url:
    url: "{{ garage_binary_url }}"
    dest: "{{ garage_bin }}"
    checksum: "{{ garage_binary_checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Ensure the Garage group exists
  ansible.builtin.group:
    name: "{{ garage_group }}"
    system: true
    state: present

- name: Ensure the Garage user exists
  ansible.builtin.user:
    name: "{{ garage_user }}"
    group: "{{ garage_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/garage
    create_home: true
    state: present

- name: Ensure the Garage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "0700"
  loop:
    - /var/lib/garage
    - "{{ garage_metadata_dir }}"
    - "{{ garage_data_dir }}"

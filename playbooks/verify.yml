---
- name: Verify the storage host
  hosts: storage
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Verify the baseline
      ansible.builtin.include_role:
        name: common
        tasks_from: verify
      tags:
        - verify
        - common

    - name: Verify PostgreSQL
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: verify
      tags:
        - verify
        - postgresql

    - name: Verify MariaDB
      ansible.builtin.include_role:
        name: mariadb
        tasks_from: verify
      tags:
        - verify
        - mariadb

    - name: Verify Garage
      ansible.builtin.include_role:
        name: garage
        tasks_from: verify
      tags:
        - verify
        - garage

    - name: Verify Elasticsearch
      ansible.builtin.include_role:
        name: elasticsearch
        tasks_from: verify
      tags:
        - verify
        - elasticsearch

    - name: Verify NGINX
      ansible.builtin.include_role:
        name: nginx
        tasks_from: verify
      tags:
        - verify
        - nginx

---
# Full convergence for one AlmaLinux 10 storage host.
# Run with an explicit inventory:
#   ansible-playbook -i inventories/dev/hosts.yml site.yml
- name: Apply the AlmaLinux 10 baseline
  import_playbook: playbooks/common.yml

- name: Configure PostgreSQL
  import_playbook: playbooks/postgresql.yml

- name: Configure MariaDB
  import_playbook: playbooks/mariadb.yml

# Garage must be ready before Elasticsearch registers its snapshot repository.
- name: Configure Garage
  import_playbook: playbooks/garage.yml

- name: Configure Elasticsearch
  import_playbook: playbooks/elasticsearch.yml

# NGINX fronts Elasticsearch over HTTPS and Garage S3 over loopback HTTP.
- name: Configure the NGINX reverse proxy
  import_playbook: playbooks/nginx.yml

- name: Verify the storage host
  import_playbook: playbooks/verify.yml
